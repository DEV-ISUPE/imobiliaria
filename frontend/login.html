<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Maison Huambo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/api.js"></script>
    <script>
        // ===============================================================
        // CONFIGURAÇÃO DO TAILWIND
        // ===============================================================
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            500: '#14b8a6',
                            600: '#0d9488',
                            900: '#134e4a',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { margin: 0; }
        /* Fundo animado com gradiente que se move suavemente */
        .bg-animated {
            background: linear-gradient(-45deg, #134e4a, #0d9488, #14b8a6, #0d9488);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        /* Efeito "vidro fosco" no cartão de login */
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .fade-in { animation: fadeIn 1s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Classe para esconder um formulário (alternar entre Login e Cadastro) */
        .form-hidden { display: none; }
    </style>
</head>
<body class="bg-animated min-h-screen flex items-center justify-center p-4">

    <!-- ============================================================
    CARTÃO CENTRAL (Login / Cadastro)
    ============================================================ -->
    <div class="glass rounded-3xl p-8 md:p-12 max-w-md w-full fade-in shadow-2xl">
        
        <!-- Logo e título -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-white/20 mb-4">
                <i data-lucide="home" class="w-8 h-8 text-white"></i>
            </div>
            <h1 class="text-3xl font-extrabold text-white mb-2">Maison Huambo</h1>
            <p class="text-white/70">Acesse sua conta ou cadastre-se</p>
        </div>

        <!-- Botões de alternância entre Login e Cadastro -->
        <div class="flex bg-white/10 rounded-xl p-1 mb-8">
            <button id="btn-login" onclick="showForm('login')" class="flex-1 py-2.5 rounded-lg font-medium text-white bg-white/20 transition">
                Login
            </button>
            <button id="btn-cadastro" onclick="showForm('cadastro')" class="flex-1 py-2.5 rounded-lg font-medium text-white/70 hover:bg-white/10 transition">
                Cadastro
            </button>
        </div>

        <!-- ============================================================
        FORMULÁRIO DE LOGIN
        ============================================================ -->
        <form id="form-login" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-white/90 mb-1">E-mail</label>
                <div class="relative">
                    <i data-lucide="mail" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-white/50"></i>
                    <input type="email" required placeholder="seu@email.com" class="w-full bg-white/10 border border-white/20 text-white placeholder-white/50 py-2.5 pl-10 pr-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-white/50">
                </div>
            </div>
            <div>
                <label class="block text-sm font-semibold text-white/90 mb-1">Senha</label>
                <div class="relative">
                    <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-white/50"></i>
                    <input type="password" required placeholder="••••••••" class="w-full bg-white/10 border border-white/20 text-white placeholder-white/50 py-2.5 pl-10 pr-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-white/50">
                </div>
            </div>
            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center gap-2 text-white/80">
                    <input type="checkbox" class="rounded border-white/30 bg-white/10 text-brand-500 focus:ring-brand-500">
                    <span>Lembrar-me</span>
                </label>
                <a href="#" class="text-white hover:text-white/80 font-medium">Esqueceu a senha?</a>
            </div>
            <button type="submit" class="w-full bg-white text-brand-900 font-bold py-3 rounded-xl hover:bg-gray-100 transition shadow-md">
                Entrar
            </button>
        </form>

        <!-- ============================================================
        FORMULÁRIO DE CADASTRO
        ============================================================ -->
        <form id="form-cadastro" class="form-hidden space-y-4">
            <div>
                <label class="block text-sm font-semibold text-white/90 mb-1">Nome Completo</label>
                <div class="relative">
                    <i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-white/50"></i>
                    <input type="text" required placeholder="Seu nome completo" class="w-full bg-white/10 border border-white/20 text-white placeholder-white/50 py-2.5 pl-10 pr-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-white/50">
                </div>
            </div>
            <div>
                <label class="block text-sm font-semibold text-white/90 mb-1">E-mail</label>
                <div class="relative">
                    <i data-lucide="mail" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-white/50"></i>
                    <input type="email" required placeholder="seu@email.com" class="w-full bg-white/10 border border-white/20 text-white placeholder-white/50 py-2.5 pl-10 pr-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-white/50">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-white/90 mb-1">Telefone</label>
                    <div class="relative">
                        <i data-lucide="phone" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-white/50"></i>
                        <input type="tel" required placeholder="92X XXX XXX" class="w-full bg-white/10 border border-white/20 text-white placeholder-white/50 py-2.5 pl-10 pr-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-white/50">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-white/90 mb-1">Tipo de Conta</label>
                    <select class="w-full bg-white/10 border border-white/20 text-white py-2.5 px-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-white/50">
                        <option value="proprietario" class="text-gray-900">Proprietário</option>
                        <option value="corretor" class="text-gray-900">Corretor</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-sm font-semibold text-white/90 mb-1">Senha</label>
                <div class="relative">
                    <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-white/50"></i>
                    <input type="password" required placeholder="Mínimo 6 caracteres" class="w-full bg-white/10 border border-white/20 text-white placeholder-white/50 py-2.5 pl-10 pr-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-white/50">
                </div>
            </div>
            <div class="flex items-start gap-2 text-sm text-white/80">
                <input type="checkbox" required class="mt-0.5 rounded border-white/30 bg-white/10 text-brand-500 focus:ring-brand-500">
                <span>Concordo com os <a href="#" class="text-white font-medium underline">Termos de Uso</a> e <a href="#" class="text-white font-medium underline">Política de Privacidade</a></span>
            </div>
            <button type="submit" class="w-full bg-white text-brand-900 font-bold py-3 rounded-xl hover:bg-gray-100 transition shadow-md">
                Criar Conta
            </button>
        </form>

        <!-- Link para voltar à página inicial -->
        <div class="mt-6 text-center">
            <a href="boas-vindas.html" class="text-white/60 hover:text-white text-sm inline-flex items-center gap-1">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                Voltar para página inicial
            </a>
        </div>

    </div>

    <!-- ============================================================
    JAVASCRIPT DA PÁGINA DE LOGIN
    ============================================================ -->
    <script>
        // ===========================================================
        // INICIALIZAÇÃO DOS ÍCONES LUCIDE
        // ===========================================================
        lucide.createIcons();

        // ===========================================================
        // showForm(form)
        // Descrição: Alterna entre o formulário de Login e Cadastro
        // Parâmetros: form (string) - 'login' ou 'cadastro'
        // -------------------------------------------
        // Como funciona:
        // 1. Obtém referências aos dois formulários e botões
        // 2. Se form === 'login': mostra o formulário de login,
        //    esconde o de cadastro, destaca o botão Login
        // 3. Se form === 'cadastro': faz o oposto
        // Isto é feito adicionando/removendo classes CSS que
        // controlam visibilidade e estilo ativo dos botões.
        function showForm(form) {
            const loginForm = document.getElementById('form-login');
            const cadastroForm = document.getElementById('form-cadastro');
            const btnLogin = document.getElementById('btn-login');
            const btnCadastro = document.getElementById('btn-cadastro');

            if (form === 'login') {
                loginForm.classList.remove('form-hidden');
                cadastroForm.classList.add('form-hidden');
                btnLogin.classList.add('bg-white/20', 'text-white');
                btnLogin.classList.remove('text-white/70');
                btnCadastro.classList.remove('bg-white/20', 'text-white');
                btnCadastro.classList.add('text-white/70');
            } else {
                loginForm.classList.add('form-hidden');
                cadastroForm.classList.remove('form-hidden');
                btnCadastro.classList.add('bg-white/20', 'text-white');
                btnCadastro.classList.remove('text-white/70');
                btnLogin.classList.remove('bg-white/20', 'text-white');
                btnLogin.classList.add('text-white/70');
            }
        }

        // ===========================================================
        // EVENT LISTENER: SUBMISSÃO DO FORMULÁRIO DE LOGIN
        // ===========================================================
        // Quando o utilizador clica "Entrar":
        // 1. Previne o recarregamento da página
        // 2. Lê o email e password dos campos
        // 3. Desativa o botão e mostra spinner de carregamento
        // 4. Chama API.login(email, password) que faz a autenticação
        // 5. Se sucesso:
        //    - Mostra toast de sucesso
        //    - Redireciona baseado no tipo de conta (role):
        //      - admin -> admin.html
        //      - proprietario -> proprietario.html
        //      - corretor -> corretor.html
        //      - outro -> index.html (página pública)
        // 6. Se erro: mostra toast com a mensagem de erro
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = e.target.querySelector('input[type="email"]').value;
            const password = e.target.querySelector('input[type="password"]').value;
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin mx-auto"></i>';
            lucide.createIcons();

            try {
                const data = await API.login(email, password);
                showToast('Login realizado com sucesso! Redirecionando...', 'success');
                // Redireciona após 1.5 segundos para o utilizador ver o toast
                setTimeout(() => {
                    const role = data.user.role;
                    if (role === 'admin') window.location.href = 'admin.html';
                    else if (role === 'proprietario') window.location.href = 'proprietario.html';
                    else if (role === 'corretor') window.location.href = 'corretor.html';
                    else window.location.href = 'index.html';
                }, 1500);
            } catch (err) {
                showToast(err.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Entrar';
            }
        });

        // ===========================================================
        // EVENT LISTENER: SUBMISSÃO DO FORMULÁRIO DE CADASTRO
        // ===========================================================
        // Quando o utilizador clica "Criar Conta":
        // 1. Previne recarregamento da página
        // 2. Lê os valores de todos os campos (input/select)
        //    usando a posição no DOM (inputs[0], inputs[1], etc.)
        // 3. Desativa botão e mostra spinner
        // 4. Chama API.register com os dados
        // 5. Se sucesso: mostra toast, volta ao formulário de login
        // 6. Se erro: mostra toast com mensagem
        document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const inputs = e.target.querySelectorAll('input, select');
            const nome = inputs[0].value;
            const email = inputs[1].value;
            const telefone = inputs[2].value;
            const role = inputs[3].value;
            const password = inputs[4].value;
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin mx-auto"></i>';
            lucide.createIcons();

            try {
                await API.register(nome, email, password, role, telefone);
                showToast('Conta criada com sucesso! Faça login.', 'success');
                showForm('login');
            } catch (err) {
                showToast(err.message, 'error');
            }
            btn.disabled = false;
            btn.textContent = 'Criar Conta';
        });

        // ===========================================================
        // showToast(message, type)
        // Descrição: Mostra uma notificação temporária
        // -------------------------------------------
        // Versão melhorada que também suporta o tipo 'error' (vermelho).
        // Se o container de toasts não existir, cria um.
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container') || createToastContainer();
            const toast = document.createElement('div');
            
            const colors = { success: 'bg-green-600', info: 'bg-blue-600', error: 'bg-red-600' };
            const icons = { success: 'check-circle', info: 'info', error: 'alert-circle' };
            const bgColor = colors[type] || 'bg-blue-600';
            const icon = icons[type] || 'info';

            toast.className = `${bgColor} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 transform transition-all duration-300 translate-y-10 opacity-0`;
            toast.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5 flex-shrink-0"></i><p class="text-sm font-medium">${message}</p>`;

            container.appendChild(toast);
            lucide.createIcons();

            // Anima a entrada (removendo as classes que o mantêm invisível)
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-10', 'opacity-0');
            });

            // Anima saída e remove após 4 segundos
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-x-10');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        // ===========================================================
        // createToastContainer()
        // Descrição: Cria o container de toasts se não existir
        // -------------------------------------------
        // Garante que o container está presente no DOM antes de
        // tentar adicionar notificações. Útil para páginas que
        // podem não ter o container pré-definido no HTML.
        function createToastContainer() {
            const container = document.createElement('div');
            container.id = 'toast-container';
            container.className = 'fixed bottom-4 right-4 z-50 flex flex-col gap-2';
            document.body.appendChild(container);
            return container;
        }

        // ===========================================================
        // INICIALIZAÇÃO
        // ===========================================================
        // Ao carregar a página, mostra o formulário de login por
        // padrão (em vez do de cadastro).
        showForm('login');
    </script>
</body>
</html>
